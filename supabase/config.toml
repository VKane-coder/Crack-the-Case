# Supabase CLI config (local development). Unlisted settings use CLI defaults.
project_id = "crack-the-case"

[api]
schemas = ["public"]

[db]
major_version = 17

[db.seed]
enabled = true
# Applied in lexical order: lookups, generated levels, generated cases.
sql_paths = ["./seed/*.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
enable_signup = true
