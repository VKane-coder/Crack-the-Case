# Supabase CLI config (local development). Unlisted settings use CLI defaults.
project_id = "crack-the-case"

[api]
schemas = ["public"]

[db]
major_version = 17

[db.seed]
enabled = true
# Applied in lexical order: lookups, generated levels, generated cases.
sql_paths = ["./seed/*.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your Crack the Case sign-in link 🩺"
content_path = "./supabase/templates/magic-link.html"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false
